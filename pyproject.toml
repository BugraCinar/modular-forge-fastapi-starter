[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "modular-forge-fastapi"
version = "1.0.0"
description = "Security-focused modular FastAPI starter with removable feature modules and SQL/MongoDB adapters."
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
authors = [{ name = "BugraCinar" }]
keywords = ["fastapi", "starter", "modular-monolith", "jwt", "sqlalchemy"]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "SQLAlchemy>=2.0.38,<2.1", "alembic>=1.14,<2",
  "PyJWT>=2.10.1,<3", "argon2-cffi>=23.1,<26",
  "redis>=5.2,<8", "httpx>=0.28,<1",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2,<4"]
mysql = ["PyMySQL>=1.1.1,<2", "cryptography>=50,<51"]
mongodb = ["pymongo>=4.11,<5"]
two-factor = ["pyotp>=2.9,<3", "cryptography>=50,<51"]
image-storage = ["boto3>=1.36,<2", "Pillow>=11.1,<14", "python-multipart>=0.0.20,<1"]
database-backup = ["cryptography>=50,<51"]
observability = ["sentry-sdk[fastapi]>=2.20,<3"]
kafka = ["kafka-python>=2.1,<3"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.8,<3", "fakeredis[lua]>=2.27,<3", "build>=1.2,<2"]

[project.scripts]
modular-forge = "modular_forge.cli:main"

[project.urls]
Repository = "https://github.com/BugraCinar/modular-forge-fastapi-starter"
Issues = "https://github.com/BugraCinar/modular-forge-fastapi-starter/issues"
"Spring Boot sibling" = "https://github.com/BugraCinar/modular-forge-spring-boot-starter"

[tool.hatch.build.targets.wheel]
packages = ["src/modular_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["contract: real database contract tests (selected with CONTRACT_DATABASE_URL)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
