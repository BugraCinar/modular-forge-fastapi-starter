# Local development stack; provision TLS, credentials and a trusted edge separately for production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: modularforge
      POSTGRES_USER: modularforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run modular-forge init-env first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modularforge -d modularforge"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    profiles: ["api"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://modularforge:${DB_PASSWORD}@postgres:5432/modularforge
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_BACKEND: redis
      ALLOWED_HOSTS: '["localhost","127.0.0.1","api"]'
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  postgres-data:
